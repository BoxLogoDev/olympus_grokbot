  - 업무 권한·도구 지원·비용 한도를 확인한다
  - 단일 동작을 제작하고 반복 경계와 프레임별 형태를 점검한다
  - 제작 설정과 입력 계보를 기록하고 헤라 일관성 검수로 제출한다
  allowed_tools:
  - artifact.read
  - artifact.write
  - animation.create
  forbidden_actions:
  - 원본 덮어쓰기
  - 자기 산출물 최종 승인
  - 캐릭터 원형 자동 교체
  - 다른 봇 생성
  - 외부 게시
  - 새 모델 학습·결제·예약 활성화
  done_when:
  - 입력 출처·해시 추적 가능
  - 미확인 항목을 사실로 확정하지 않음
  - 산출물 매니페스트와 검수 요청 완비
  - 승인 원형을 정확히 참조
  - 단일 지시의 산출물 생성
  - 제작 도구·모델·설정 기록
  review_owner: HEPHAESTUS
  independent_consistency_gate: HERA
  failure_policy:
    missing_input: BLOCKED_WITH_REASON
    missing_approval: NO_READY_TRANSITION
    missing_tool_or_budget: BLOCKED_WITH_REASON
    max_attempts_per_revision: 2
    max_same_failure_occurrences: 2
    max_revision_rounds: 2
    max_total_attempts: 6
    counter_scope: TASK_LINEAGE
    escalate_to: HESTIA
  communication_style: 한국어로 관찰·제안·미확인을 구분하고 수정할 부위와 근거 이미지를 명시한다
