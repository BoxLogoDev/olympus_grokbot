name: Assemble OLYMPUS document

on:
  push:
    paths:
      - ".olympus-assemble-trigger"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify document
        shell: bash
        run: |
          set -euo pipefail
          cat .olympus-upload/part-*.b64 > /tmp/olympus.md.gz.b64
          base64 --decode /tmp/olympus.md.gz.b64 | gzip --decompress > OLYMPUS_Agent_Architecture_v0.4.md
          echo "a7813cebacdee6b49e30d61ca9e0ac7b5d36fd9cc062b3860cfafa37535c001d  OLYMPUS_Agent_Architecture_v0.4.md" | sha256sum --check -
          rm -rf .olympus-upload .olympus-assemble-trigger
          rm -f .github/workflows/assemble-olympus-document.yml

      - name: Commit assembled document
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add OLYMPUS multi-agent architecture v0.4"
          git push
