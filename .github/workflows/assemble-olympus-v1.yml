name: Assemble OLYMPUS v1.0

on:
  push:
    paths:
      - ".olympus-v1-trigger"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify OLYMPUS v1.0 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .olympus-upload-v1/part-* > /tmp/olympus-v1.tar.gz.b64
          base64 --decode /tmp/olympus-v1.tar.gz.b64 > /tmp/olympus-v1.tar.gz
          echo "f62326e97a4f9604311c3c3db52bd627331022bb9d53c6b2eec03b35ed50e686  /tmp/olympus-v1.tar.gz" | sha256sum --check -
          tar -xzf /tmp/olympus-v1.tar.gz -C .

          cat > /tmp/olympus-v1.sha256 <<'CHECKSUMS'
          bd17022280bf6c4827aac9852e64a4a16394338dfbf38086f19fd5ea3e60f72c  OLYMPUS_Agent_Architecture_v1.0.md
          f3853488f0f563c736768f56d7d8b07a2d733f579c4537b71ceb96080f0469cf  README.md
          4c5dfaadc4fea1d8c4e6fa61794acc292937b9417be68e9bd84f30288fae28f1  prompts/OLYMPUS_Bot_Prompts_v1.0.md
          df8d730b38748b754ef82d128a5b4d1bdfbf1c07dfed1537003428d8b40d05e0  registry/humans.yaml
          430298592f1bde0fb07e284e9abb4c632577364fb90e03eb5fd235189ca591ca  registry/slots.yaml
          9da6fb40a0cb7db84d58fce12c4f8661bc9d03f7334c8e7583bf0d4b81e5d82f  spec/olympus-contracts-v1.yaml
          3e8ba07cf83f3a6895646ffebf5625b320ca205a4c8f8765279be446026078c6  templates/contracts.example.yaml
          CHECKSUMS
          sha256sum --check /tmp/olympus-v1.sha256

          rm -rf .olympus-upload-v1 .olympus-v1-trigger .github/workflows/assemble-olympus-v1.yml

      - name: Commit OLYMPUS v1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: promote OLYMPUS architecture to v1.0"
            git push
          fi
