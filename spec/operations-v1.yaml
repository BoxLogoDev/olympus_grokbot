# OLYMPUS v1.3 운영 목표 계약. required_fields는 필수 필드 명세이며 자체 검증 엔진이 아니다.
# 아래 규칙 전체가 현재 로컬 런타임에서 강제된다고 해석하지 않는다.
operations:
  schema_version: '1.0'
  architecture_version: '1.3'
  implementation_stage: DOCUMENTED
  runtime_status: LOCAL_SIMULATION_ONLY
  authority_contract: spec/olympus-contracts-v1.yaml
  playbook: playbooks/agent-operations.md
  prototype:
    ledger: runtime/ledger.py
    demo_command: python -m runtime.demo --db /tmp/olympus-bam.sqlite
    evaluation: runtime/evaluations.py
    evaluation_command: python -m runtime.evaluations examples/evaluation-sample.json
    evaluation_recommendations: [DEMO_ONLY, INCONCLUSIVE, KEEP_BASELINE, CANDIDATE_FOR_REVIEW]
    evaluation_recommendation_is_activation_permission: false
    example_minimum_pairs: 20
    example_minimum_is_statistical_confidence: false
    example_minimum_is_global_policy: false
    scope: LOCAL_METADATA_TASKS_AND_OFFLINE_EVALUATION
    real_provider_calls: false
    real_human_registration: false
    trusted_approval_issuance: false
    real_artifact_generation: false
    actual_performance_evidence: false
    production_services:
      router: NOT_IMPLEMENTED
      model_gateway: NOT_IMPLEMENTED
      tool_gateway: NOT_IMPLEMENTED
      authenticated_approval_queue: NOT_IMPLEMENTED
      external_publication: NOT_IMPLEMENTED
      routine_scheduler: NOT_IMPLEMENTED
    unsupported_production_requirements:
    - ALL_POLICY_AND_CHARACTER_CANON_VALIDATION
    - ARTIFACT_STORE_ACCESS_AND_BINARY_HASH_VERIFICATION
    - DISTRIBUTED_WORKER_LEASE_FENCING
    - AUTHENTICATED_IDENTITY_AND_REVIEW
    - PRODUCTION_PARENT_PROJECT_BUDGET_HIERARCHY
    - MEMORY_RETRIEVAL_AND_REVOCATION
    - AUTOMATED_VERSION_ROLLOUT_AND_ROLLBACK
    - AUTOMATIC_WORKFLOW_REUSE_QUALIFICATION
    tests_are_actual_manual_validation_runs: false
  rule_bindings:
    OLY-OPS-001: workflow_reuse
    OLY-OPS-002: checkpoint_and_invalidation
    OLY-OPS-003: evaluation
    OLY-OPS-004: curated_memory
    OLY-OPS-005: version_change
    OLY-OPS-006: resource_control
  workflow_reuse:
    rule_id: OLY-OPS-001
    decision_owner: HESTIA
    executor_is_new_agent: false
    preserves_god_selection_and_review: true
    required_fields:
    - workflow_id
    - version
    - sha256
    - policy_version
    - policy_commit
    - input_contract
    - output_contract
    - stages
    - review_gates
    - approval_gates
    - validation_runs
    - status
    - selected_by
    stage_required_fields:
    - stage_id
    - owner_god
    - slot_id
    - depends_on
    - input_bindings
    - output_contract
    - execution_template_ref
    - review_owner
    - side_effect_class
    - budget
    assignment_required_fields:
    - plan_ref
    - owner_human_id
    - capability_ref
    states: [DRAFT, IN_REVIEW, VALIDATED, SUSPENDED, SUPERSEDED]
    validation:
      minimum_actual_manual_e2e_passes: 2
      same_final_version_and_distinct_run_ids: true
      unexpected_human_interventions_allowed: false
      planned_approval_steps_allowed: true
      synthetic_run_counts_as_validation: false
      minimum_is_reliability_guarantee: false
      validation_reference: olympus.routine_policy
    every_run_rechecks:
    - HESTIA_PLAN_AND_SCOPE
    - CURRENT_POLICY_COMPATIBILITY
    - CURRENT_APPROVED_CHARACTER_CANON_WHEN_APPLICABLE
    - INPUT_CONTRACT_AND_HASHES
    - REGISTERED_SINGLE_JOB_OWNER
    - CAPABILITY_AND_BUDGET
    - REVIEW_AND_APPROVAL_GATES
    behavior_change_requires_new_version_and_validation: true
    exception_action: BLOCK_RECORD_AND_RETURN_TO_HESTIA
    reuse_grants_scheduling: false
    reuse_grants_publication: false
    routine_activation_policy: olympus.routine_policy
    external_action_policy: olympus.approval_execution_policy
  checkpoint_and_invalidation:
    rule_id: OLY-OPS-002
    required_fields:
    - checkpoint_id
    - project_id
    - run_id
    - workflow_ref
    - stage_id
    - task_id
    - revision
    - input_generation
    - input_digest
    - input_refs
    - output_refs
    - owner_human_id
    - lease_generation
    - execution_template_ref
    - model_profile_ref
    - policy_version
    - policy_commit
    - memory_refs
    - review_ref
    - retry_lineage_ref
    - cumulative_attempts
    - cumulative_cost_units
    - created_at
    reference_fields: [id, version, sha256]
    states_and_validity_are_separate: true
    validity: [CURRENT, STALE, REVIEW_REQUIRED]
    completed_history_immutable: true
    dependency_types:
    - ARTIFACT
    - EXTERNAL_INPUT
    - CURRENT_CHARACTER_CANON
    - POLICY
    - WORKFLOW
    - EXECUTION_TEMPLATE
    - MODEL_PROFILE
    - MEMORY_VERSION
    invalidate_scope: DIRECT_CONSUMERS_AND_TRANSITIVE_DESCENDANTS
    independent_reuse_requires:
    - IDENTICAL_PINNED_INPUT_FINGERPRINT
    - ACCESSIBLE_HASH_VERIFIED_ARTIFACT
    - REVIEW_PASS
    - CURRENT_POLICY_AND_CANON_COMPATIBILITY
    - VALID_CAPABILITY_AND_BUDGET_FOR_NEW_ACTION
    changed_inflight_stage:
      production: STOP_ASSIGNMENTS_QUARANTINE_AND_RECONCILE_WORKER_BEFORE_RELEASING_LEASE
      prototype: REJECT_CHANGE_WHILE_AFFECTED_STAGE_IS_ACTIVE
    late_result: PRESERVE_HISTORY_REJECT_CURRENT_PROMOTION
    atomic_commit_scope:
    - ATTEMPT_RESULT
    - CHECKPOINT
    - CURRENT_POINTER
    - EVENT
    - COST_SETTLEMENT
    - LEASE_RELEASE_WHEN_OUTCOME_CONFIRMED
    idempotency_scope: PROJECT_RUN_STAGE_REVISION_INPUT_GENERATION_ACTION
    external_side_effects:
      persist_intent_before_dispatch: true
      complete_action_manifest_required: true
      unknown_outcome: BLOCK_RETAIN_RESERVATION_AND_LEASE_RECONCILE
      local_transaction_proves_exactly_once_remote_effect: false
      changed_manifest_requires_new_approval: true
      already_published_artifacts: PRESERVE_HISTORY_SEPARATE_APPROVED_CHANGE
    inherited_limits: olympus.retry_policy
    new_run_or_card_resets_lineage_counters: false
  evaluation:
    rule_id: OLY-OPS-003
    owner: HERA
    collection_owner: DEMETER
    producer_is_final_reviewer: false
    layers:
      deterministic: SCHEMA_FORMAT_REQUIRED_TESTS_POLICY_BLOCKERS
      qualitative: INDEPENDENT_REVIEW_WITH_REASON_AND_REFERENCE
      calibration: COMPARE_EVALUATOR_DECISION_TO_VERIFIED_LABELS
    case_required_fields:
    - case_id
    - dataset_id
    - dataset_version
    - scope
    - data_origin
    - input_ref
    - output_ref
    - expected_decision
    - label_author
    - label_verifier
    - label_evidence_ref
    - rubric_version
    - created_at
    data_origins: [REAL_ACCEPTED, REAL_REJECTED, SYNTHETIC]
    verified_label_sources: [ZEUS_DECISION, INDEPENDENT_REVIEW]
    unreviewed_model_label_is_ground_truth: false
    contradictory_labels: EXCLUDE_UNTIL_ADJUDICATED_AND_REPORT_COUNT
    calibration_and_comparison_case_sets_separate: true
    data_scope_and_access_policy_required: true
    blockers_override_score: true
    default_pass_score_reference: olympus.quality.default_pass_score
    report_required_fields:
    - dataset_ref
    - evaluator_ref
    - rubric_version
    - scope
    - data_origin_counts
    - total_case_count
    - eligible_case_count
    - missing_case_count
    - disagreement_count
    - agreement_rate
    - false_pass_count
    - false_reject_count
    - blocker_count
    - limitations
    empty_sample: UNMEASURED
    synthetic_samples_prove_real_quality: false
    metrics:
      first_pass_rate:
        numerator: DISTINCT_OUTPUTS_PASSING_FIRST_REVIEW
        denominator: DISTINCT_OUTPUTS_RECEIVING_FIRST_REVIEW
        cancelled_before_review: EXCLUDED_AND_REPORTED_SEPARATELY
      cost_per_accepted_output:
        numerator: TOTAL_PROJECT_SETTLED_COST_INCLUDING_FAILED_CANCELLED_REVIEW_AND_REWORK
        denominator: DISTINCT_FINAL_ACCEPTED_OUTPUTS
        zero_denominator: UNDEFINED_REPORT_TOTAL_COST
      completion_time:
        definition: PROJECT_REQUEST_TO_FINAL_ACCEPTANCE_WALL_CLOCK
        report_waiting_and_execution_separately: true
        unfinished: REPORT_CENSORED_NOT_ZERO
      user_revision_count:
        definition: DISTINCT_USER_REQUESTED_CHANGE_EVENTS
        distinguish_scope_change_from_quality_fix: true
      review_wait_time:
        definition: REVIEW_SUBMISSION_TO_REVIEW_START
      common_required_context:
      - OBSERVATION_WINDOW
      - SAMPLE_COUNT
      - PRODUCT_AND_TASK_SCOPE
      - CURRENCY_OR_EXPLICIT_SIMULATION_UNIT
      - REAL_OR_SYNTHETIC
    no_evidence_means: UNMEASURED
  curated_memory:
    rule_id: OLY-OPS-004
    proposer: DEMETER
    scope_owner: PARENT_GOD
    write_validation_owner: HESTIA
    quality_rule_verifier: HERA
    independent_verification_required: true
    required_fields:
    - memory_id
    - version
    - kind
    - statement
    - status
    - evidence_refs
    - scope
    - owner_god
    - proposed_by
    - verified_by
    - verification_ref
    - valid_from
    - expires_at
    - supersedes
    - revoked_at
    - revocation_reason
    kinds: [FACT, PROCEDURE, PREFERENCE, HYPOTHESIS]
    states: [PROPOSED, VERIFIED, ACTIVE, EXPIRED, REVOKED, SUPERSEDED]
    valid_from_requires_verified_record: true
    null_expiry_requires: NO_EXPIRY_REASON_AND_RECHECK_TRIGGER
    scope_dimensions:
    - project_id
    - department
    - slot_id
    - template_version
    - model_profile_version
    - character_canon_ref
    - data_classification
    injection_requires:
    - ACTIVE
    - CURRENT_TIME_WITHIN_VALIDITY
    - SCOPE_MATCH
    - ACCESS_AUTHORIZED
    - NO_CONTRADICTING_CURRENT_POLICY_OR_CANON
    injected_versions_recorded_on_task: true
    supersession_and_revocation_are_append_only_events: true
    revocation_requires_affected_task_review: true
    raw_feedback_is_active_memory: false
    human_can_edit_own_execution_history: false
    automatic_policy_or_canon_promotion: false
  version_change:
    rule_id: OLY-OPS-005
    proposal_owner: PARENT_GOD
    evaluation_owner: HERA
    rollout_owner: HESTIA
    states: [PROPOSED, EVALUATING, INCONCLUSIVE, REJECTED, ELIGIBLE_FOR_REVIEW, LIMITED_ROLLOUT, ACTIVE, ROLLED_BACK]
    required_fields:
    - change_id
    - scope
    - baseline_ref
    - candidate_ref
    - changed_dimensions
    - dataset_ref
    - rubric_ref
    - minimum_sample_policy
    - acceptance_criteria
    - stop_conditions
    - rollback_ref
    - evaluation_report_ref
    - review_decision_ref
    comparable_dimensions:
    - SAME_PAIRED_INPUTS_AND_DATASET_VERSION
    - SAME_VERIFIED_LABELS
    - SAME_RUBRIC_AND_EVALUATOR_VERSION
    - SAME_TOOLS_CAPABILITIES_AND_COST_UNITS
    - RECORDED_MODEL_SETTINGS_AND_MEMORY_SNAPSHOTS
    - RECORDED_OBSERVATION_WINDOW
    preregister_before_results:
    - MINIMUM_ELIGIBLE_SAMPLES_AND_SCOPE_COVERAGE
    - QUALITY_NONREGRESSION_OR_GAIN_CRITERIA
    - COST_AND_LATENCY_LIMITS
    - BLOCKERS
    - ROLLOUT_SCOPE_AND_ROLLBACK_CONDITIONS
    inconclusive_when:
    - INSUFFICIENT_REAL_ELIGIBLE_SAMPLES
    - ONLY_SYNTHETIC_DATA
    - UNVERIFIED_OR_CONFLICTING_LABELS
    - INCOMPARABLE_DATASETS_OR_RUBRICS
    - MISSING_PAIRED_RESULTS
    - MIXED_RESULTS_WITHOUT_PREDEFINED_TRADEOFF
    aggregate_score_overrides_blocker: false
    statistical_superiority_claim_requires_separate_valid_analysis: true
    score_alone_activates_candidate: false
    first_rollout_scope: EXPLICIT_LIMITED_NEW_TASKS
    inflight_tasks_keep_pinned_version: true
    rollback_requires_current_policy_and_canon_compatibility: true
    rollout_or_rollback_mutates_human_identity: false
    preserve_previous_templates_and_history: true
    new_permissions_or_policy_change: FOLLOW_EXISTING_ZEUS_APPROVAL_RULES
    memory_snapshot_is_part_of_change_context: true
  resource_control:
    rule_id: OLY-OPS-006
    owner: HESTIA
    required_project_fields:
    - project_id
    - parent_project_id
    - root_budget_id
    - budget_unit
    - max_cost_units
    - max_active_tasks
    - max_pending_reviews
    - review_capacity
    - review_budget_reserve_units
    - stop_conditions
    - resume_policy
    budget_units: NONNEGATIVE_INTEGER_FIXED_UNIT
    max_limits: POSITIVE_INTEGER
    atomic_assignment_checks:
    - GLOBAL_SINGLE_ACTIVE_TASK_PER_HUMAN
    - ALL_ANCESTOR_PROJECT_ACTIVE_TASK_LIMITS
    - ALL_ANCESTOR_PROJECT_BUDGET_RESERVATIONS
    - TASK_RETRY_AND_BUDGET_LIMITS
    - REVIEW_BACKPRESSURE_FOR_PRODUCTION_TASKS
    available_budget: LIMIT_MINUS_SETTLED_MINUS_RESERVED
    cost_scope: PRODUCTION_REVIEW_FAILURE_REWORK_AND_EXPERIMENTS
    missing_cost_estimate: BLOCK_NEW_PAID_EXECUTION
    unknown_outcome_keeps_reservation: true
    actual_overrun: RECORD_FULL_COST_STOP_NEW_ASSIGNMENTS_AND_ESCALATE
    finished_attempt_settlement: SETTLE_ACTUAL_RELEASE_UNUSED_RESERVATION
    split_projects_or_retry_cards_reset_limits: false
    review_backpressure:
      pause_production_when: PENDING_REVIEW_COUNT_GTE_LIMIT
      waiting_task_state: READY
      block_reason: REVIEW_BACKPRESSURE
      review_tasks_may_drain: true
      reserved_review_capacity_and_budget_required: true
      reviewer_single_active_task_limit: 1
      resume_requires_recorded_reason: true
    data_from_prototype_is_real_spend: false
