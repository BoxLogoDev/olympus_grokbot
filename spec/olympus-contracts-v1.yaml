    - project_lines.CHARACTER
  character_policy:
    rule_id: OLY-CHR-001
    playbook: playbooks/character-production.md
    registry_paths:
    - characters/bam/character.yaml
    execution_templates: templates/character-production.yaml
    character_is_human: false
    variants_create_humans: false
    preserve_originals: true
    generated_output_auto_promotes_to_canon: false
    canon_states:
    - DRAFT
    - IN_REVIEW
    - WAITING_APPROVAL
    - APPROVED
    - SUPERSEDED
    canon_approval:
      approver: ZEUS
      review_owner: HERA
      action: CHARACTER_CANON_APPROVE
      authenticated_event_required: true
      scope:
      - character_id
      - canon_id
      - version
      - sha256
      - reference_assets
      reference_asset_fields:
      - asset_id
      - version
      - sha256
      any_change_invalidates: true
      grants_external_publication: false
      verification_policy: approval_execution_policy
    production_ready_requires:
    - REGISTERED_SINGLE_OWNER
    - COMPLETE_EXECUTION_TEMPLATE
    - TASK_TOOL_CAPABILITY_AND_BUDGET
    - APPROVED_CURRENT_CANON
    - MATCHING_CANON_APPROVAL_EVENT
    - ACCESSIBLE_HASH_VERIFIED_REFERENCES
    - VERSIONED_PRODUCTION_BRIEF
    motion_additional_requires:
    - CONSISTENCY_PASSED_INPUT_STILL
    - MATCHING_INPUT_CANON
    - MOTION_BRIEF
    missing_precondition:
      ready_allowed: false
      reason_field: block_reason
      task_states_policy: states.task
    derived_manifest_extension:
    - character_id
    - variant_id
    - canon_ref
    - reference_assets
    - production_brief_ref
    - generation_record
    - consistency_review_ref
    canon_ref_fields:
    - canon_id
    - version
    - sha256
    reference_asset_fields:
    - asset_id
    - version
    - sha256
    - storage_ref
    generation_record_fields:
    - method
    - tool
    - tool_version
    - model
    - model_version
    - settings
    - seed
    unavailable_generation_field: NULL_WITH_REASON
    review_pending_before_review_allowed: true
    consuming_lines_require:
    - APPROVED_CANON
    - CONSISTENCY_REVIEW_PASS
    - PINNED_ASSET_VERSION_AND_HASH
    - TARGET_FORMAT_REVIEW
    superseded_canon_reuse: IMPACT_REVIEW_AND_EXPLICIT_ZEUS_EXCEPTION
    public_release_policy: approval_execution_policy
    source_storage_default: CONTROLLED_EXTERNAL_ASSET_STORE
    new_training_or_paid_tool_activation_included: false
    retry_policy: retry_policy
